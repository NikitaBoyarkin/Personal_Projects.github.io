<!DOCTYPE html>
<html lang="ru">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1">
<title>Когортная матрица удержания</title>
<style>
  :root{
    --bg:#fafaf7; --ink:#1f2430; --muted:#6b7280; --line:#e5e7eb;
    --empty:#f1f3f5; --empty-ink:#9aa3ad;
  }
  *{box-sizing:border-box}
  body{
    margin:0; padding:24px; background:var(--bg); color:var(--ink);
    font-family:-apple-system,BlinkMacSystemFont,"Segoe UI",Roboto,"Helvetica Neue",Arial,sans-serif;
    font-size:14px; line-height:1.5;
  }
  h1{font-size:18px; margin:0 0 4px}
  .lede{margin:0 0 18px; color:var(--muted); font-size:13px}
  .matrix{
    display:grid;
    grid-template-columns: 76px repeat(7, 1fr);
    gap:4px;
    max-width:620px;
  }
  .col-head, .row-head{
    display:flex; align-items:center; justify-content:center;
    font-size:12px; font-weight:600; color:var(--muted);
    padding:6px 0;
  }
  .row-head{justify-content:flex-start; padding-left:8px}
  .cell{
    position:relative; border-radius:6px; min-height:46px;
    display:flex; align-items:center; justify-content:center;
    font-size:12px; font-weight:600; color:#1f2430;
    cursor:default; transition:transform .12s ease, box-shadow .12s ease;
  }
  .cell.empty{
    background:var(--empty); color:var(--empty-ink);
    font-weight:400; font-size:14px;
  }
  .cell.data:hover{
    transform:translateY(-2px);
    box-shadow:0 6px 16px rgba(0,0,0,.15);
    z-index:2;
  }
  .ytitle{
    grid-column:1; grid-row:1 / span 8; writing-mode:vertical-rl;
    transform:rotate(180deg); display:flex; align-items:center;
    justify-content:center; font-size:11px; color:var(--muted); font-weight:600;
  }
  .xtitle{
    grid-column:2 / span 7; grid-row: 9; text-align:center;
    font-size:11px; color:var(--muted); font-weight:600; padding-top:8px;
  }
  .legend{
    margin-top:14px; display:flex; align-items:center; gap:10px;
    font-size:12px; color:var(--muted);
  }
  .scale{display:flex; height:12px; width:180px; border-radius:3px; overflow:hidden}
  .tip{
    position:fixed; pointer-events:none; background:#1f2430; color:#fff;
    padding:10px 12px; border-radius:8px; font-size:12px; line-height:1.45;
    box-shadow:0 8px 24px rgba(0,0,0,.25); opacity:0; transition:opacity .12s ease; z-index:50;
  }
  .tip b{font-size:13px}
  .tip .sub{color:#c8e6c9; margin-top:3px; display:block}
  @media (max-width:520px){
    body{padding:14px}
    .cell{min-height:38px; font-size:10px}
    .row-head{font-size:10px; padding-left:4px}
  }
</style>
</head>
<body>
  <h1>Когортная матрица удержания</h1>
  <p class="lede">Строки — месячные когорты, столбцы — месяц с момента старта (M0…M6). Пустые ячейки справа — будущее, его ещё нет. Наведите на ячейку.</p>

  <div class="matrix" id="matrix"></div>
  <div class="legend">
    <span>0%</span>
    <div class="scale" id="scale"></div>
    <span>100%</span>
  </div>
  <div class="tip" id="tip"></div>

<script>
// Строки: когорты (янв…июл 2025). Столбцы: M0..M6. null — период не наступил.
const ROWS = [
  {c:"Янв 2025", v:[100, 42, 33, 28, 26, 25, 24]},
  {c:"Фев 2025", v:[100, 40, 32, 27, 25, 24, null]},
  {c:"Мар 2025", v:[100, 45, 35, 30, 28, 27, null]},
  {c:"Апр 2025", v:[100, 48, 38, 32, 30, null, null]},
  {c:"Май 2025", v:[100, 50, 40, 34, null, null, null]},
  {c:"Июн 2025", v:[100, 52, 42, null, null, null, null]},
  {c:"Июл 2025", v:[100, 55, null, null, null, null, null]},
];
const PERIODS = ["M0","M1","M2","M3","M4","M5","M6"];

// Цвет: интерполяция от #e8f5e9 (пало) к #2e7d32 (насыщенный зелёный)
function colorFor(ret){
  const t = Math.min(1, ret/100);
  // от светлого (232,245,233) к тёмному (46,125,50)
  const r = Math.round(232 + (46-232)*t);
  const g = Math.round(245 + (125-245)*t);
  const b = Math.round(233 + (50-233)*t);
  return `rgb(${r},${g},${b})`;
}
function textOn(ret){
  // Тёмный текст на светлых ячейках, светлый — на тёмных
  return ret >= 55 ? '#ffffff' : '#1f2430';
}

const m = document.getElementById("matrix");

// Y title
const yt = document.createElement("div");
yt.className = "ytitle";
yt.textContent = "Когорта →";
m.appendChild(yt);

// Заголовки столбцов
const corner = document.createElement("div");
corner.className = "row-head";
corner.textContent = "";
m.appendChild(corner);
PERIODS.forEach(p=>{
  const h = document.createElement("div");
  h.className = "col-head";
  h.textContent = p;
  m.appendChild(h);
});

// Строки
ROWS.forEach(row=>{
  const rh = document.createElement("div");
  rh.className = "row-head";
  rh.textContent = row.c;
  m.appendChild(rh);
  row.v.forEach((val, i)=>{
    const cell = document.createElement("div");
    if (val === null){
      cell.className = "cell empty";
      cell.textContent = "—";
    } else {
      cell.className = "cell data";
      cell.style.background = colorFor(val);
      cell.style.color = textOn(val);
      cell.textContent = val + "%";
      cell.dataset.cohort = row.c;
      cell.dataset.period = PERIODS[i];
      cell.dataset.val = val;
    }
    m.appendChild(cell);
  });
});

// X title
const xt = document.createElement("div");
xt.className = "xtitle";
xt.textContent = "← Месяц с момента старта";
m.appendChild(xt);

// Шкала легенды
const scale = document.getElementById("scale");
for (let i=0; i<=20; i++){
  const s = document.createElement("div");
  s.style.flex = "1";
  s.style.background = colorFor(i*5);
  scale.appendChild(s);
}

// Тултип
const tip = document.getElementById("tip");
m.addEventListener("mouseover", e=>{
  const c = e.target.closest(".cell.data");
  if (!c) return;
  const note = c.dataset.period === "M0"
    ? "По определению 100% — база, не сигнал удержания."
    : (parseInt(c.dataset.period.slice(1)) >= 5
       ? "Поздний период: мало когорт, выводы ненадёжны."
       : "Доля когорты, вернувшейся в этот месяц.");
  tip.innerHTML = "<b>"+c.dataset.cohort+"</b> · "+c.dataset.period+
    " — "+c.dataset.val+"% удержания"+
    '<span class="sub">'+note+"</span>";
  tip.style.opacity = 1;
});
m.addEventListener("mousemove", e=>{
  tip.style.left = (e.clientX + 14) + "px";
  tip.style.top  = (e.clientY + 14) + "px";
});
m.addEventListener("mouseout", e=>{
  if (!e.target.closest(".cell.data")) return;
  tip.style.opacity = 0;
});
</script>
</body>
</html>
