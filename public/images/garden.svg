<svg viewBox="0 0 1200 600" xmlns="http://www.w3.org/2000/svg" role="img" aria-label="Digital garden: linked notes graph network">
  <defs>
    <linearGradient id="bg" x1="0" y1="0" x2="1" y2="1">
      <stop offset="0" stop-color="#0f0f11"/>
      <stop offset="1" stop-color="#18181b"/>
    </linearGradient>
    <linearGradient id="accent" x1="0" y1="0" x2="0" y2="1">
      <stop offset="0" stop-color="#60a5fa"/>
      <stop offset="1" stop-color="#2563eb"/>
    </linearGradient>
  </defs>

  <rect width="1200" height="600" fill="url(#bg)"/>

  <!-- graph edges -->
  <g stroke="#3f3f46" stroke-width="2">
    <line x1="600" y1="300" x2="320" y2="160"/>
    <line x1="600" y1="300" x2="880" y2="160"/>
    <line x1="600" y1="300" x2="300" y2="440"/>
    <line x1="600" y1="300" x2="900" y2="440"/>
    <line x1="320" y1="160" x2="180" y2="280"/>
    <line x1="880" y1="160" x2="1020" y2="280"/>
    <line x1="300" y1="440" x2="200" y2="520"/>
    <line x1="900" y1="440" x2="1000" y2="520"/>
    <line x1="320" y1="160" x2="520" y2="100"/>
    <line x1="880" y1="160" x2="680" y2="100"/>
    <line x1="180" y1="280" x2="300" y2="440"/>
    <line x1="1020" y1="280" x2="900" y2="440"/>
  </g>

  <!-- accent edges from hub -->
  <g stroke="#60a5fa" stroke-width="3">
    <line x1="600" y1="300" x2="320" y2="160"/>
    <line x1="600" y1="300" x2="880" y2="160"/>
    <line x1="600" y1="300" x2="300" y2="440"/>
    <line x1="600" y1="300" x2="900" y2="440"/>
  </g>

  <!-- nodes -->
  <g>
    <circle cx="600" cy="300" r="34" fill="url(#accent)"/>
    <circle cx="320" cy="160" r="20" fill="#60a5fa"/>
    <circle cx="880" cy="160" r="20" fill="#60a5fa"/>
    <circle cx="300" cy="440" r="20" fill="#60a5fa" opacity="0.8"/>
    <circle cx="900" cy="440" r="20" fill="#60a5fa" opacity="0.8"/>
    <circle cx="180" cy="280" r="14" fill="#3f3f46"/>
    <circle cx="1020" cy="280" r="14" fill="#3f3f46"/>
    <circle cx="200" cy="520" r="12" fill="#3f3f46"/>
    <circle cx="1000" cy="520" r="12" fill="#3f3f46"/>
    <circle cx="520" cy="100" r="11" fill="#93c5fd"/>
    <circle cx="680" cy="100" r="11" fill="#93c5fd"/>
  </g>
</svg>