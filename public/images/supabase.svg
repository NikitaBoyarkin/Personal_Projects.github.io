<svg viewBox="0 0 1200 600" xmlns="http://www.w3.org/2000/svg" role="img" aria-label="Supabase product analytics: Postgres cylinder with Row Level Security shield and an A/B test bar chart">
  <defs>
    <linearGradient id="sbg" x1="0" y1="0" x2="1" y2="1">
      <stop offset="0" stop-color="#0f2421"/>
      <stop offset="1" stop-color="#16302b"/>
    </linearGradient>
    <linearGradient id="sacc" x1="0" y1="0" x2="0" y2="1">
      <stop offset="0" stop-color="#54e8a6"/>
      <stop offset="1" stop-color="#3ecf8e"/>
    </linearGradient>
  </defs>

  <rect width="1200" height="600" fill="url(#sbg)"/>

  <!-- Postgres cylinder -->
  <g transform="translate(110,150)">
    <ellipse cx="120" cy="40" rx="120" ry="34" fill="#1d3b35" stroke="#3ecf8e" stroke-width="2"/>
    <path d="M0,40 L0,220 Q120,254 240,220 L240,40" fill="#16302b" stroke="#3ecf8e" stroke-width="2"/>
    <ellipse cx="120" cy="40" rx="120" ry="34" fill="#1d3b35" stroke="#3ecf8e" stroke-width="2"/>
    <g fill="#3ecf8e" opacity="0.55">
      <ellipse cx="120" cy="100" rx="120" ry="34" fill="none" stroke="#3ecf8e" stroke-width="1"/>
      <ellipse cx="120" cy="160" rx="120" ry="34" fill="none" stroke="#3ecf8e" stroke-width="1"/>
    </g>
    <text x="120" y="46" text-anchor="middle" fill="#e4e4e7" font-family="SF Mono, Monaco, monospace" font-size="20">Postgres</text>
  </g>

  <!-- RLS shield -->
  <g transform="translate(420,160)">
    <path d="M70,0 L130,22 L130,70 Q130,118 70,140 Q10,118 10,70 L10,22 Z" fill="#1d3b35" stroke="url(#sacc)" stroke-width="3"/>
    <text x="70" y="80" text-anchor="middle" fill="#54e8a6" font-family="SF Mono, Monaco, monospace" font-size="22" font-weight="600">RLS</text>
    <text x="70" y="178" text-anchor="middle" fill="#9fb3ad" font-family="Inter, sans-serif" font-size="16">per-org isolation</text>
  </g>

  <!-- A/B bars -->
  <g transform="translate(720,180)">
    <text x="0" y="-10" fill="#9fb3ad" font-family="SF Mono, Monaco, monospace" font-size="18">A/B  χ²  p=0.0034</text>
    <g>
      <rect x="0" y="120" width="70" height="80" fill="#2a4a43"/>
      <text x="35" y="215" text-anchor="middle" fill="#e4e4e7" font-family="SF Mono, Monaco, monospace" font-size="16">ctrl</text>
      <text x="35" y="112" text-anchor="middle" fill="#9fb3ad" font-family="SF Mono, Monaco, monospace" font-size="15">32.1%</text>
    </g>
    <g>
      <rect x="110" y="50" width="70" height="150" fill="url(#sacc)"/>
      <text x="145" y="215" text-anchor="middle" fill="#e4e4e7" font-family="SF Mono, Monaco, monospace" font-size="16">trt</text>
      <text x="145" y="42" text-anchor="middle" fill="#54e8a6" font-family="SF Mono, Monaco, monospace" font-size="15">37.2%</text>
    </g>
    <text x="90" y="260" text-anchor="middle" fill="#54e8a6" font-family="Inter, sans-serif" font-size="18" font-weight="600">+5.1pp</text>
  </g>
</svg>