<svg viewBox="0 0 1200 600" xmlns="http://www.w3.org/2000/svg" role="img" aria-label="Leakage-free churn model: chronological snapshot split and top-decile lift">
  <defs>
    <linearGradient id="bg" x1="0" y1="0" x2="1" y2="1">
      <stop offset="0" stop-color="#0f2a2b"/>
      <stop offset="1" stop-color="#1a3435"/>
    </linearGradient>
    <linearGradient id="accent" x1="0" y1="0" x2="0" y2="1">
      <stop offset="0" stop-color="#ff8569"/>
      <stop offset="1" stop-color="#ff6643"/>
    </linearGradient>
  </defs>

  <rect width="1200" height="600" fill="url(#bg)"/>

  <!-- chronological snapshot split -->
  <g font-family="SF Mono, Monaco, monospace" text-anchor="middle">
    <text x="600" y="120" font-size="22" font-weight="bold" fill="#ff8569" letter-spacing="1">as-of snapshot split — no future leakage</text>

    <line x1="120" y1="250" x2="1080" y2="250" stroke="#234044" stroke-width="2"/>

    <g>
      <rect x="120" y="196" width="250" height="108" rx="10" fill="url(#accent)"/>
      <text x="245" y="240" font-size="20" font-weight="bold" fill="#3b1210">TRAIN</text>
      <text x="245" y="268" font-size="14" fill="#3b1210">2024-01-15</text>
    </g>
    <g>
      <rect x="475" y="196" width="250" height="108" rx="10" fill="url(#accent)" opacity="0.78"/>
      <text x="600" y="240" font-size="20" font-weight="bold" fill="#3b1210">VAL</text>
      <text x="600" y="268" font-size="14" fill="#3b1210">2024-02-15</text>
    </g>
    <g>
      <rect x="830" y="196" width="250" height="108" rx="10" fill="url(#accent)" opacity="0.58"/>
      <text x="955" y="240" font-size="20" font-weight="bold" fill="#3b1210">TEST</text>
      <text x="955" y="268" font-size="14" fill="#3b1210">2024-03-15</text>
    </g>

    <!-- label window under train: 30d inactivity -->
    <text x="245" y="345" font-size="13" fill="#a1a1aa">label: no activity in snapshot+30d</text>
  </g>

  <!-- top-decile lift bars -->
  <g font-family="SF Mono, Monaco, monospace">
    <text x="120" y="440" font-size="15" fill="#a1a1aa">recall@top-10%</text>
    <rect x="120" y="458" width="420" height="34" rx="6" fill="none" stroke="#234044" stroke-width="1.5"/>
    <rect x="120" y="458" width="223" height="34" rx="6" fill="url(#accent)"/>
    <text x="560" y="481" font-size="16" font-weight="bold" fill="#ff8569">53%</text>

    <text x="120" y="530" font-size="15" fill="#a1a1aa">lift@top-10% vs random</text>
    <text x="560" y="530" font-size="16" font-weight="bold" fill="#ff8569">3.07×</text>

    <text x="1080" y="530" font-size="15" fill="#71717a" text-anchor="end">Brier 0.068</text>
  </g>
</svg>
