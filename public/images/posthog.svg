<svg viewBox="0 0 1200 600" xmlns="http://www.w3.org/2000/svg" role="img" aria-label="PostHog product analytics pipeline: event funnel, cohort retention grid, and A/B test">
  <defs>
    <linearGradient id="pbg" x1="0" y1="0" x2="1" y2="1">
      <stop offset="0" stop-color="#101a3a"/>
      <stop offset="1" stop-color="#16224a"/>
    </linearGradient>
    <linearGradient id="pacc" x1="0" y1="0" x2="0" y2="1">
      <stop offset="0" stop-color="#9c5cff"/>
      <stop offset="1" stop-color="#7a45ff"/>
    </linearGradient>
  </defs>

  <rect width="1200" height="600" fill="url(#pbg)"/>

  <!-- Funnel -->
  <g transform="translate(110,120)">
    <text x="180" y="-10" text-anchor="middle" fill="#9fb0e6" font-family="SF Mono, Monaco, monospace" font-size="18">funnel</text>
    <polygon points="0,0 360,0 300,70 60,70" fill="#1f2c57"/>
    <polygon points="60,75 300,75 250,145 110,145" fill="#263464"/>
    <polygon points="110,150 250,150 210,220 150,220" fill="url(#pacc)"/>
    <g fill="#e4e4e7" font-family="SF Mono, Monaco, monospace" font-size="14">
      <text x="180" y="40" text-anchor="middle">app_open</text>
      <text x="180" y="115" text-anchor="middle">signup</text>
      <text x="180" y="190" text-anchor="middle">subscribe</text>
    </g>
  </g>

  <!-- Cohort heatmap -->
  <g transform="translate(620,120)">
    <text x="0" y="-10" fill="#9fb0e6" font-family="SF Mono, Monaco, monospace" font-size="18">cohort retention</text>
    <g>
      <rect x="0" y="0" width="48" height="48" fill="#1f2c57"/>
      <rect x="0" y="52" width="48" height="48" fill="#3a2c7a"/>
      <rect x="0" y="104" width="48" height="48" fill="#5b3aa0"/>
      <rect x="52" y="0" width="48" height="48" fill="#263464"/>
      <rect x="52" y="52" width="48" height="48" fill="#4a3090"/>
      <rect x="52" y="104" width="48" height="48" fill="url(#pacc)"/>
      <rect x="104" y="0" width="48" height="48" fill="#2a376e"/>
      <rect x="104" y="52" width="48" height="48" fill="#5b3aa0"/>
      <rect x="104" y="104" width="48" height="48" fill="#7a45ff" opacity="0.6"/>
    </g>
  </g>

  <!-- A/B + CI -->
  <g transform="translate(900,120)">
    <text x="0" y="-10" fill="#9fb0e6" font-family="SF Mono, Monaco, monospace" font-size="18">A/B  +SRM</text>
    <line x1="0" y1="70" x2="180" y2="70" stroke="#3a4670" stroke-width="2"/>
    <line x1="40" y1="55" x2="140" y2="55" stroke="#9c5cff" stroke-width="4" stroke-linecap="round"/>
    <circle cx="90" cy="55" r="7" fill="#9c5cff"/>
    <text x="90" y="100" text-anchor="middle" fill="#e4e4e7" font-family="SF Mono, Monaco, monospace" font-size="15">uplift · Wilson CI</text>
    <text x="90" y="150" text-anchor="middle" fill="#9c5cff" font-family="Inter, sans-serif" font-size="16">no SRM ✓</text>
  </g>

  <!-- bottom event stream -->
  <g transform="translate(110,470)">
    <text x="0" y="0" fill="#9fb0e6" font-family="SF Mono, Monaco, monospace" font-size="16">events → PostHog</text>
    <g fill="#7a45ff" opacity="0.85">
      <rect x="0" y="20" width="14" height="40"/><rect x="22" y="30" width="14" height="30"/>
      <rect x="44" y="15" width="14" height="45"/><rect x="66" y="35" width="14" height="25"/>
      <rect x="88" y="20" width="14" height="40"/><rect x="110" y="28" width="14" height="32"/>
      <rect x="132" y="18" width="14" height="42"/><rect x="154" y="33" width="14" height="27"/>
      <rect x="176" y="22" width="14" height="38"/><rect x="198" y="30" width="14" height="30"/>
    </g>
  </g>
</svg>