<svg viewBox="0 0 1200 600" xmlns="http://www.w3.org/2000/svg" role="img" aria-label="Streamlit product analytics dashboard: AARRR KPI cards, cohort retention heatmap, and revenue bars">
  <defs>
    <linearGradient id="tbg" x1="0" y1="0" x2="1" y2="1">
      <stop offset="0" stop-color="#2a1417"/>
      <stop offset="1" stop-color="#341a1e"/>
    </linearGradient>
    <linearGradient id="tacc" x1="0" y1="0" x2="0" y2="1">
      <stop offset="0" stop-color="#ff6b6b"/>
      <stop offset="1" stop-color="#ff4b4b"/>
    </linearGradient>
  </defs>

  <rect width="1200" height="600" fill="url(#tbg)"/>

  <!-- KPI cards -->
  <g transform="translate(80,90)" font-family="Inter, sans-serif">
    <g>
      <rect x="0" y="0" width="150" height="90" rx="10" fill="#3a1d22" stroke="#5a2b32" stroke-width="1"/>
      <text x="14" y="32" fill="#d99" font-size="13">Users</text>
      <text x="14" y="66" fill="#fff" font-size="26" font-weight="700">8,000</text>
    </g>
    <g transform="translate(165,0)">
      <rect x="0" y="0" width="150" height="90" rx="10" fill="#3a1d22" stroke="#5a2b32" stroke-width="1"/>
      <text x="14" y="32" fill="#d99" font-size="13">MRR</text>
      <text x="14" y="66" fill="url(#tacc)" font-size="26" font-weight="700">↑</text>
    </g>
    <g transform="translate(330,0)">
      <rect x="0" y="0" width="150" height="90" rx="10" fill="#3a1d22" stroke="#5a2b32" stroke-width="1"/>
      <text x="14" y="32" fill="#d99" font-size="13">Stickiness</text>
      <text x="14" y="66" fill="#fff" font-size="26" font-weight="700">DAU/MAU</text>
    </g>
  </g>

  <!-- AARRR funnel steps -->
  <g transform="translate(80,240)" font-family="SF Mono, Monaco, monospace" font-size="13" fill="#e4c9c9">
    <text x="0" y="0">AARRR</text>
    <rect x="0" y="14" width="430" height="26" fill="#4a2329"/>
    <rect x="0" y="14" width="430" height="26" fill="url(#tacc)" opacity="0.85"/>
    <text x="8" y="32">app_open → signup → activate → start_trial → subscribe</text>
  </g>

  <!-- Cohort heatmap -->
  <g transform="translate(620,150)">
    <text x="0" y="-8" fill="#d99" font-family="SF Mono, Monaco, monospace" font-size="15">cohort retention</text>
    <g>
      <rect x="0" y="0" width="44" height="44" fill="#3a1d22"/>
      <rect x="0" y="48" width="44" height="44" fill="#5a2b32"/>
      <rect x="0" y="96" width="44" height="44" fill="#7a3038"/>
      <rect x="48" y="0" width="44" height="44" fill="#4a2329"/>
      <rect x="48" y="48" width="44" height="44" fill="#6e2d36"/>
      <rect x="48" y="96" width="44" height="44" fill="url(#tacc)" opacity="0.7"/>
      <rect x="96" y="0" width="44" height="44" fill="#52262d"/>
      <rect x="96" y="48" width="44" height="44" fill="#7a3038"/>
      <rect x="96" y="96" width="44" height="44" fill="#ff4b4b" opacity="0.5"/>
    </g>
  </g>

  <!-- Revenue bars -->
  <g transform="translate(820,150)">
    <text x="0" y="-8" fill="#d99" font-family="SF Mono, Monaco, monospace" font-size="15">revenue / MRR</text>
    <g fill="url(#tacc)">
      <rect x="0" y="110" width="26" height="30"/>
      <rect x="34" y="90" width="26" height="50"/>
      <rect x="68" y="70" width="26" height="70"/>
      <rect x="102" y="48" width="26" height="92"/>
      <rect x="136" y="26" width="26" height="114"/>
    </g>
    <line x1="0" y1="140" x2="170" y2="140" stroke="#5a2b32" stroke-width="2"/>
  </g>

  <!-- footer -->
  <g transform="translate(80,420)" font-family="SF Mono, Monaco, monospace" font-size="15" fill="#d99">
    <text x="0" y="0">seed = 42 · @st.cache_data · 5 pages · reproducible</text>
  </g>
</svg>