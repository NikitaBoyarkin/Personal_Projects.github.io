<svg viewBox="0 0 1200 600" xmlns="http://www.w3.org/2000/svg" role="img" aria-label="ML preprocessing pipeline: impute, encode, split, scale">
  <defs>
    <linearGradient id="bg" x1="0" y1="0" x2="1" y2="1">
      <stop offset="0" stop-color="#0f2a2b"/>
      <stop offset="1" stop-color="#1a3435"/>
    </linearGradient>
    <linearGradient id="accent" x1="0" y1="0" x2="0" y2="1">
      <stop offset="0" stop-color="#ff8569"/>
      <stop offset="1" stop-color="#ff6643"/>
    </linearGradient>
  </defs>

  <rect width="1200" height="600" fill="url(#bg)"/>

  <!-- pipeline boxes: data -> impute -> encode -> split -> scale -->
  <g font-family="SF Mono, Monaco, monospace" font-size="16" fill="#0f2a2b" text-anchor="middle" font-weight="bold">
    <g>
      <rect x="70" y="240" width="170" height="120" rx="10" fill="url(#accent)"/>
      <text x="155" y="300">Data</text>
      <text x="155" y="326" font-size="13" fill="#3b1210">CSV → DataFrame</text>
    </g>
    <g>
      <rect x="320" y="240" width="170" height="120" rx="10" fill="url(#accent)" opacity="0.88"/>
      <text x="405" y="300">Imputer</text>
      <text x="405" y="326" font-size="13" fill="#3b1210">mean / missing</text>
    </g>
    <g>
      <rect x="570" y="240" width="170" height="120" rx="10" fill="url(#accent)" opacity="0.76"/>
      <text x="655" y="300">Encoder</text>
      <text x="655" y="326" font-size="13" fill="#3b1210">one-hot / label</text>
    </g>
    <g>
      <rect x="820" y="240" width="170" height="120" rx="10" fill="url(#accent)" opacity="0.64"/>
      <text x="905" y="300">Split</text>
      <text x="905" y="326" font-size="13" fill="#3b1210">80 / 20</text>
    </g>
  </g>

  <!-- connector arrows -->
  <g stroke="#ffa68a" stroke-width="3" fill="none" marker-end="url(#arrow)">
    <line x1="240" y1="300" x2="310" y2="300"/>
    <line x1="490" y1="300" x2="560" y2="300"/>
    <line x1="740" y1="300" x2="810" y2="300"/>
    <line x1="990" y1="300" x2="1050" y2="300"/>
  </g>
  <defs>
    <marker id="arrow" viewBox="0 0 10 10" refX="8" refY="5" markerWidth="7" markerHeight="7" orient="auto-start-reverse">
      <path d="M 0 0 L 10 5 L 0 10 z" fill="#ffa68a"/>
    </marker>
  </defs>

  <!-- scaler badge below split -->
  <g font-family="SF Mono, Monaco, monospace" font-size="16" fill="#a1a1aa">
    <rect x="820" y="420" width="170" height="56" rx="10" fill="none" stroke="#234044" stroke-width="1.5"/>
    <text x="905" y="447" text-anchor="middle" fill="#ffa68a">Scaler</text>
    <text x="905" y="466" text-anchor="middle" font-size="12" fill="#71717a">fit on train only</text>
  </g>

  <!-- dashed link split -> scaler -->
  <g stroke="#234044" stroke-width="1.5" stroke-dasharray="5 5">
    <line x1="905" y1="360" x2="905" y2="410"/>
  </g>
</svg>