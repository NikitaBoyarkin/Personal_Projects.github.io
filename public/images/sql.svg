<svg viewBox="0 0 1200 600" xmlns="http://www.w3.org/2000/svg" role="img" aria-label="SQL analytics case study: tables, queries, window functions">
  <defs>
    <linearGradient id="bg" x1="0" y1="0" x2="1" y2="1">
      <stop offset="0" stop-color="#0f2a2b"/>
      <stop offset="1" stop-color="#1a3435"/>
    </linearGradient>
    <linearGradient id="accent" x1="0" y1="0" x2="0" y2="1">
      <stop offset="0" stop-color="#ff8569"/>
      <stop offset="1" stop-color="#ff6643"/>
    </linearGradient>
  </defs>

  <rect width="1200" height="600" fill="url(#bg)"/>

  <!-- table grid -->
  <g stroke="#3f3f46" stroke-width="1.5">
    <rect x="80" y="80" width="1040" height="440" fill="none"/>
    <line x1="80" y1="140" x2="1120" y2="140"/>
    <line x1="80" y1="200" x2="1120" y2="200"/>
    <line x1="80" y1="260" x2="1120" y2="260"/>
    <line x1="80" y1="320" x2="1120" y2="320"/>
    <line x1="80" y1="380" x2="1120" y2="380"/>
    <line x1="80" y1="440" x2="1120" y2="440"/>
    <line x1="320" y1="80" x2="320" y2="520"/>
    <line x1="560" y1="80" x2="560" y2="520"/>
    <line x1="800" y1="80" x2="800" y2="520"/>
  </g>

  <!-- header row accent -->
  <rect x="80" y="80" width="1040" height="60" fill="url(#accent)" opacity="0.18"/>
  <line x1="80" y1="140" x2="1120" y2="140" stroke="#ff8569" stroke-width="2.5"/>

  <!-- highlighted cells (a query result) -->
  <rect x="80" y="200" width="240" height="60" fill="#ff6643" opacity="0.35"/>
  <rect x="560" y="320" width="240" height="60" fill="#ff8569" opacity="0.28"/>
  <rect x="800" y="380" width="320" height="60" fill="#ff6643" opacity="0.22"/>

  <!-- DuckDB duck-ish mark, top-right corner -->
  <g transform="translate(1010,470)" opacity="0.9">
    <ellipse cx="50" cy="30" rx="46" ry="22" fill="url(#accent)"/>
    <circle cx="86" cy="20" r="14" fill="#ff8569"/>
    <circle cx="90" cy="18" r="2.5" fill="#0f2a2b"/>
    <polygon points="100,20 118,24 100,30" fill="#fbbf24"/>
  </g>
</svg>