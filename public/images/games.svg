<svg viewBox="0 0 1200 600" xmlns="http://www.w3.org/2000/svg" role="img" aria-label="Browser mini-games analytics arcade: gamepad with analytics game chips">
  <defs>
    <linearGradient id="gg" x1="0" y1="0" x2="1" y2="1"><stop offset="0" stop-color="#10242a"/><stop offset="1" stop-color="#16303a"/></linearGradient>
    <linearGradient id="gc1" x1="0" y1="0" x2="0" y2="1"><stop offset="0" stop-color="#5eead4"/><stop offset="1" stop-color="#14b8a6"/></linearGradient>
    <linearGradient id="gpow" x1="0" y1="0" x2="0" y2="1"><stop offset="0" stop-color="#fbbf24"/><stop offset="1" stop-color="#f59e0b"/></linearGradient>
  </defs>
  <rect width="1200" height="600" fill="url(#gg)"/>
  <text x="80" y="64" fill="#9fb8bf" font-family="SF Mono, Monaco, monospace" font-size="21" letter-spacing="1">BROWSER MINI-GAMES · ANALYTICS ARCADE</text>
  <text x="80" y="92" fill="#5eead4" font-family="SF Mono, Monaco, monospace" font-size="15">self-contained SVGs — zero deps, no build step</text>

  <!-- gamepad -->
  <g transform="translate(120,150)">
    <rect x="40" y="60" width="280" height="200" rx="30" fill="#1c3a42" stroke="#2b525e" stroke-width="2"/>
    <!-- d-pad -->
    <rect x="100" y="130" width="26" height="64" rx="7" fill="url(#gc1)"/>
    <rect x="87" y="143" width="52" height="38" rx="7" fill="url(#gc1)"/>
    <!-- buttons -->
    <circle cx="240" cy="120" r="17" fill="url(#gpow)"/>
    <circle cx="278" cy="120" r="17" fill="url(#gpow)"/>
    <circle cx="240" cy="158" r="17" fill="url(#gpow)"/>
    <circle cx="278" cy="158" r="17" fill="url(#gpow)"/>
    <!-- start/select -->
    <rect x="130" y="210" width="34" height="9" rx="4" fill="#64748b"/>
    <rect x="180" y="210" width="34" height="9" rx="4" fill="#64748b"/>
    <!-- play triangle -->
    <polygon points="180,96 180,128 206,112" fill="#5eead4" opacity="0.9"/>
  </g>
  <text x="160" y="420" fill="#cbd5e1" font-family="SF Mono, Monaco, monospace" font-size="14">swipe / tap · keyboard / mouse</text>

  <!-- game chips -->
  <g transform="translate(480,150)" font-family="SF Mono, Monaco, monospace">
    <!-- col 1 -->
    <rect x="0" y="0" width="250" height="30" rx="6" fill="#1c3a42" stroke="#2b525e" stroke-width="1"/>
    <text x="10" y="16" fill="#5eead4" font-size="13" font-weight="700">A/B Test</text>
    <text x="12" y="31" fill="#9fb8bf" font-size="11">collect until p &lt; 0.05</text>
    <rect x="0" y="36" width="250" height="30" rx="6" fill="#1c3a42" stroke="#2b525e" stroke-width="1"/>
    <text x="10" y="52" fill="#5eead4" font-size="13" font-weight="700">Funnel Drop</text>
    <text x="12" y="67" fill="#9fb8bf" font-size="11">catch falling users</text>
    <rect x="0" y="72" width="250" height="30" rx="6" fill="#1c3a42" stroke="#2b525e" stroke-width="1"/>
    <text x="10" y="88" fill="#5eead4" font-size="13" font-weight="700">Cohort Catch</text>
    <text x="12" y="103" fill="#9fb8bf" font-size="11">catch Returning, dodge Churned</text>
    <rect x="0" y="108" width="250" height="30" rx="6" fill="#1c3a42" stroke="#2b525e" stroke-width="1"/>
    <text x="10" y="124" fill="#5eead4" font-size="13" font-weight="700">SQL Query</text>
    <text x="12" y="139" fill="#9fb8bf" font-size="11">pick the completing token</text>
    <rect x="0" y="144" width="250" height="30" rx="6" fill="#1c3a42" stroke="#2b525e" stroke-width="1"/>
    <text x="10" y="160" fill="#5eead4" font-size="13" font-weight="700">Retention Day</text>
    <text x="12" y="175" fill="#9fb8bf" font-size="11">pick the right retention day</text>
    <!-- col 2 -->
    <rect x="270" y="0" width="250" height="30" rx="6" fill="#1c3a42" stroke="#2b525e" stroke-width="1"/>
    <text x="280" y="16" fill="#5eead4" font-size="13" font-weight="700">Metric Match</text>
    <text x="282" y="31" fill="#9fb8bf" font-size="11">match metric pairs</text>
    <rect x="270" y="36" width="250" height="30" rx="6" fill="#1c3a42" stroke="#2b525e" stroke-width="1"/>
    <text x="280" y="52" fill="#5eead4" font-size="13" font-weight="700">Funnel Bottleneck</text>
    <text x="282" y="67" fill="#9fb8bf" font-size="11">find the biggest drop</text>
    <rect x="270" y="72" width="250" height="30" rx="6" fill="#1c3a42" stroke="#2b525e" stroke-width="1"/>
    <text x="280" y="88" fill="#94a3b8" font-size="13" font-weight="700">Snake</text>
    <text x="282" y="103" fill="#9fb8bf" font-size="11">arcade</text>
    <rect x="270" y="108" width="250" height="30" rx="6" fill="#1c3a42" stroke="#2b525e" stroke-width="1"/>
    <text x="280" y="124" fill="#94a3b8" font-size="13" font-weight="700">Pong</text>
    <text x="282" y="139" fill="#9fb8bf" font-size="11">arcade</text>
    <rect x="270" y="144" width="250" height="30" rx="6" fill="#1c3a42" stroke="#2b525e" stroke-width="1"/>
    <text x="280" y="160" fill="#94a3b8" font-size="13" font-weight="700">2048</text>
    <text x="282" y="175" fill="#9fb8bf" font-size="11">arcade</text>
  </g>
  <text x="80" y="560" fill="#9fb8bf" font-family="SF Mono, Monaco, monospace" font-size="14">10 games · 7 analytics · zero-dependency · phone + desktop · PostHog-tracked</text>
</svg>
