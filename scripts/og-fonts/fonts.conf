<?xml version="1.0"?>
<!DOCTYPE fontconfig SYSTEM "urn:fontconfig:fonts.dtd">
<!--
  Deterministic font set for the OG banner renderer.

  Pipeline: SVG template -> rsvg-convert -> pango -> fontconfig.
  fontconfig cannot read .woff2, and the site's Inter / Cormorant are shipped
  only as variable .woff2. Static TTF instances of the exact weights the
  banners use therefore live next to this file, and every OG script spawns
  rsvg-convert with:

      cwd            = scripts/og-fonts
      FONTCONFIG_FILE = this file

  so the relative <dir> below resolves to the vendored fonts, not the cwd the
  script happened to be launched from (fontconfig treats a bare relative <dir>
  as cwd-relative, hence the explicit prefix="cwd").

  Do not add fonts here without also committing them under scripts/og-fonts/.
-->
<fontconfig>
  <description>OG banner fonts (Inter + Cormorant, static TTF)</description>

  <dir prefix="cwd">.</dir>
  <cachedir>~/.cache/fontconfig-og</cachedir>

  <!-- System fonts stay reachable only as a glyph-level safety net; the
       banners always name Inter / Cormorant explicitly. Paths are OS-specific
       and ignore_missing keeps the config portable. -->
  <include ignore_missing="yes">/opt/homebrew/etc/fonts/fonts.conf</include>
  <include ignore_missing="yes">/etc/fonts/fonts.conf</include>

  <alias>
    <family>sans-serif</family>
    <prefer><family>Inter</family></prefer>
  </alias>
  <alias>
    <family>serif</family>
    <prefer><family>Cormorant</family></prefer>
  </alias>
</fontconfig>
